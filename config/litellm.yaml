model_list:
  - model_name: chat-fast
    litellm_params:
      model: os.environ/CHAT_FAST_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: chat-smart
    litellm_params:
      model: os.environ/CHAT_SMART_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
litellm_settings:
  num_retries: 0
  request_timeout: 120
  drop_params: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
