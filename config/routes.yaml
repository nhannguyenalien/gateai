  max_input_bytes: 10000
  fixed: {n: 1, quality: medium}
  max_cost_micros: 15000
  user_price_micros: 75000
# ByteDance Seedream 5.0 lite: $0.035/image, 2K
image-seedream:
  enabled: true
  kind: image
  provider: openrouter
  model: bytedance-seed/seedream-5-0-lite
  allowed_inputs: [prompt, aspect_ratio]
  allowed_values: {aspect_ratio: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16", "21:9", "4:5", "5:4"]}
  max_input_bytes: 10000
  fixed: {n: 1, resolution: 2K}
  max_cost_micros: 35000
  user_price_micros: 175000
# xAI Grok Imagine 2.0: $0.04/image (low quality, 1K)
image-grok:
  enabled: true
  kind: image
  provider: openrouter
  model: x-ai/grok-imagine-image-2.0
