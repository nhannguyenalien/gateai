# USD micro-units: 1 USD = 1,000,000. These are illustrative bounds, NOT vendor quotes.
# Verify provider price for fixed parameters before enabling any route.
chat-fast:
  enabled: false
  kind: chat
  provider: litellm
  model: chat-fast
  allowed_inputs: [messages, stream]
  max_input_bytes: 12000
  fixed: {max_tokens: 1024, stream: false}
  max_cost_micros: 10000
  user_price_micros: 20000
chat-smart:
  enabled: false
  kind: chat
  provider: litellm
  model: chat-smart
  allowed_inputs: [messages, stream]
  max_input_bytes: 12000
  fixed: {max_tokens: 1024, stream: false}
  max_cost_micros: 100000
  user_price_micros: 200000
image-standard:
  enabled: false
  kind: image
  provider: fal
  model: fal-ai/flux/schnell
  allowed_inputs: [prompt]
  fixed: {num_images: 1, image_size: square_hd, num_inference_steps: 4}
  max_cost_micros: 20000
  user_price_micros: 40000
# Cloudflare Workers AI FLUX.2 klein via the existing worker (free tier; 80 images/day, VN time).
image-flux-free:
  enabled: true
  kind: image
  provider: cloudflare
  model: "@cf/black-forest-labs/flux-2-klein-4b"
  allowed_inputs: [prompt, width, height, guidance, seed]
  max_input_bytes: 12000
  daily_limit: 80
  fixed: {}
  max_cost_micros: 1000
  user_price_micros: 10000

# OpenRouter Image API (sync). FLUX.2 klein 4B lists $0.014/MP; price targets >=5x cost. Requires OPENROUTER_API_KEY and S3_* storage.
image-flux:
  enabled: true
  kind: image
  provider: openrouter
  model: black-forest-labs/flux.2-klein-4b
  allowed_inputs: [prompt, aspect_ratio]
  allowed_values: {aspect_ratio: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16", "21:9"]}
  max_input_bytes: 10000
  fixed: {n: 1}
  max_cost_micros: 16000
  user_price_micros: 80000

# Famous image models via OpenRouter Image API. Price = 5x max_cost (OpenRouter list prices, 2026-10-10).
# FLUX.2 pro: $0.03/MP, default ~1MP
image-flux-pro:
  enabled: true
  kind: image
  provider: openrouter
  model: black-forest-labs/flux.2-pro
  allowed_inputs: [prompt, aspect_ratio]
  allowed_values: {aspect_ratio: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16", "21:9"]}
  max_input_bytes: 10000
  fixed: {n: 1, output_format: jpeg}
  max_cost_micros: 36000
  user_price_micros: 180000
# Google Nano Banana 2.1: $0.00003/output token, 1K image ~1.3k tokens (~$0.04)
image-nano-banana:
  enabled: true
  kind: image
  provider: openrouter
  model: google/gemini-nano-banana-2.1
  allowed_inputs: [prompt, aspect_ratio]
  allowed_values: {aspect_ratio: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16", "21:9", "4:5", "5:4"]}
  max_input_bytes: 10000
  fixed: {n: 1, resolution: 1K}
  max_cost_micros: 45000
  user_price_micros: 225000
# OpenAI gpt-image-1-mini: $0.000008/output token, medium 1024x1024 ~1k tokens (~$0.01)
image-gpt-mini:
  enabled: true
  kind: image
  provider: openrouter
  model: openai/gpt-image-1-mini
  allowed_inputs: [prompt, aspect_ratio]
