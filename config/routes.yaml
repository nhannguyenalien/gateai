  provider: fal
  model: REPLACE_WITH_VERIFIED_FAL_STT_ENDPOINT
  allowed_inputs: [audio_url]
  fixed: {}
  max_cost_micros: 100000
  user_price_micros: 200000
custom-gpu:
  enabled: false
  kind: custom
  provider: runpod
  model: REPLACE_WITH_SERVERLESS_ENDPOINT_ID
  allowed_inputs: [prompt]
  fixed: {}
  max_cost_micros: 1000000
