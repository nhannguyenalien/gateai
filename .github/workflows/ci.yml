name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateai
          POSTGRES_PASSWORD: gateai
          POSTGRES_DB: gateai
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gateai:gateai@localhost:5432/gateai
      ADMIN_KEY: test-admin-key
      LITELLM_MASTER_KEY: sk-test-litellm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m app.db
      - run: uv run pytest -q
      - run: docker build -t gateai:test .
